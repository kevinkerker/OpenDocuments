name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.job-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            job-name: linux-x86_64
            target-os: linux
            target-arch: x86_64
            rustflags: -Z min-recursion-limit=512 --cfg=rustix_use_libc
          - os: macos-latest
            job-name: macos-aarch64
            target-os: macos
            target-arch: aarch64
            rustflags: -Z min-recursion-limit=512 --cfg=rustix_use_libc
          - os: windows-latest
            job-name: windows-x86_64
            target-os: windows
            target-arch: x86_64
            rustflags: -Z min-recursion-limit=512

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/webui/package-lock.json

      - name: Build WebUI
        run: |
          cd apps/webui
          npm ci
          npm run build

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Rust binaries
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: ${{ matrix.rustflags }}
        # Release builds ship the local embedder (fastembed) as first-start fallback without a provider.
        run: cargo build --release -p opendoc -p opendoc-engine-lancedb --features opendoc/embedding-fastembed

      - name: Package Release Assets
        shell: bash
        run: |
          NAME="${{ matrix.target-os }}-${{ matrix.target-arch }}"
          mkdir -p dist
          cd dist
          if [ "${{ matrix.target-os }}" = "windows" ]; then
            cp ../target/release/opendoc.exe ../target/release/opendoc-engine-lancedb.exe .
            7z a -tzip "opendoc-$NAME.zip" opendoc.exe opendoc-engine-lancedb.exe
            rm opendoc.exe opendoc-engine-lancedb.exe
            ASSETS="opendoc-$NAME.zip"
          else
            cp ../target/release/opendoc "opendoc-$NAME"
            cp ../target/release/opendoc-engine-lancedb "opendoc-engine-lancedb-$NAME"
            chmod +x "opendoc-$NAME" "opendoc-engine-lancedb-$NAME"
            ASSETS="opendoc-$NAME opendoc-engine-lancedb-$NAME"
          fi

          # Calculate checksums
          for ASSET in $ASSETS; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$ASSET" > "$ASSET.sha256"
            else
              shasum -a 256 "$ASSET" > "$ASSET.sha256"
            fi
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opendoc-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: dist/

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Consolidate checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm *.sha256
          echo "Consolidated checksums:"
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          files: |
            dist/opendoc-*
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
